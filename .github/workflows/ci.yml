name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Format check
      run: npm run format:check

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Unit tests
      run: npm run test -- --watch=false

    - name: End-to-end tests
      run: npm run test:e2e
<div class="main-wrapper">
  <div class="container">

    <!-- Floating Controls -->
<div class="floating-controls">

  <!-- Time Format -->
  <button 
    class="control-btn"
    [title]="timeFormat() === '24h' ? 'Ubah ke Format 12 Jam' : 'Ubah ke Format 24 Jam'"
    (click)="toggleTimeFormat()"
  >
    {{ timeFormat() }}
  </button>

  <!-- Favorites -->
  <button 
    class="control-btn"
    [class.active]="facade.showFavoritesOnly()"
    (click)="facade.toggleFavoritesOnly()"
    [title]="facade.showFavoritesOnly() ? 'Tampilkan Semua Kota' : 'Tampilkan Favorit Saja'"
  >
    ❤️
    <span *ngIf="favoritesService.getFavoritesCount() > 0" class="badge">{{ favoritesService.getFavoritesCount() }}</span>
  </button>

  <!-- Theme -->
  <button class="control-btn" (click)="toggleTheme()" [title]="themeService.currentTheme() === 'light' ? 'Aktifkan Dark Mode' : 'Aktifkan Light Mode'">
    <span *ngIf="themeService.currentTheme() === 'light'">🌙</span>
    <span *ngIf="themeService.currentTheme() === 'dark'">☀️</span>
  </button>

  <!-- Alarm & Timer -->
  <button class="control-btn" (click)="showAlarmTimer.set(!showAlarmTimer())" title="Alarm & Timer">
    🔔⏱️
  </button>

</div>

    <div class="header">
      <h1>Jam Dunia Modern</h1>
    </div>

    <!-- Search Input Section -->
    <div class="search-section">
      <div class="search-container">
        <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Cari kota..."
          [value]="searchService.searchQuery()"
          (input)="searchService.updateSearchQuery($any($event.target).value)"
          (keydown.escape)="searchService.clearSearch()"
        />
        <button *ngIf="searchService.searchQuery()" class="search-clear-btn" (click)="searchService.clearSearch()" title="Clear search">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <p *ngIf="searchService.searchQuery()" class="search-results-count">
        Ditemukan {{ facade.filteredLocations().length }} kota
      </p>
    </div>

    <!-- Alarm & Timer Panel -->
    <app-alarm-timer *ngIf="showAlarmTimer()"></app-alarm-timer>

    <!-- Timezone Converter Panel -->
    <app-timezone-converter></app-timezone-converter>

    <!-- Display Result or No Results Message -->
    <ng-container *ngIf="facade.filteredLocations().length === 0 && searchService.searchQuery(); else clockList">
      <div class="no-results">
        <p>Tidak ada kota yang cocok dengan "<strong>{{ searchService.searchQuery() }}</strong>"</p>

        <button class="reset-search-btn" (click)="searchService.clearSearch()">
          Coba Cari Lagi
        </button>
      </div>
    </ng-container>

    <ng-template #clockList>
      <div class="clock-list" [ngClass]="getViewModeClass()">
        <div
          *ngFor="let loc of facade.filteredLocations().slice(0, facade.itemsToShow()); trackBy: trackByLocationName"
          class="location"
          [class.fade-in]="facade.getRecentlyAdded()() === loc.name"
          [class.fade-out]="facade.getRecentlyRemoved()() === loc.name"
          [class.theme-transition]="facade.getRecentlyToggledTheme()()"
        >
          <div class="location-info">
            <p class="city-name">{{ loc.name }}</p>
            <p class="time-box">
              {{ getFormattedTime(loc.offset) }}
            </p>
          </div>

          <button
            class="favorite-btn"
            [class.favorited]="favoritesService.isFavorite(loc)"
            (click)="favoritesService.toggleFavorite(loc)"
            [title]="favoritesService.isFavorite(loc) ? 'Remove from favorites' : 'Add to favorites'"
          >
            <svg *ngIf="favoritesService.isFavorite(loc)" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <svg *ngIf="!favoritesService.isFavorite(loc)" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="facade.isLoading()" class="loading-container">
        <div class="spinner"></div>
        <p class="loading-text">Sedang memuat...</p>
      </div>

      <!-- Load More Button -->
      <button *ngIf="!facade.isLoading() && facade.itemsToShow() < facade.filteredLocations().length" class="load-more-btn" (click)="facade.loadMore()" [disabled]="facade.isLoading()">
        <span>⧬ Muat Lebih Banyak</span>
      </button>

      <!-- All Loaded Message -->
      <p *ngIf="facade.isAllLoaded()" class="all-loaded">✓ Semua kota telah dimuat!</p>
    </ng-template>

  </div>

  <!-- Tombol Scroll to Top Lingkaran untuk disesuaikan dengan bagian yang dibagikan dan diminta oleh departemen tersebut. -->
  <button class="scroll-to-top-btn" (click)="scrollToTop()" title="Kembali ke atas">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
      <line x1="12" y1="21" x2="12" y2="9"></line>
    </svg>
  </button>

</div>
